<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/layout.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
    <div class="container-fluid m-2" style="width: 400px;">

      <h3>Configurações</h3>
      
      <form id="configForm">

        <div class="row mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="autoLogin" name="autoLogin">
            <label class="form-check-label" for="autoLogin">
              Login Automatico
            </label>
          </div>
        </div>   

        <div class="row mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="findArtifacts" name="findArtifacts">
            <label class="form-check-label" for="findArtifacts">
              Buscar Artefatos
            </label>
          </div>
        </div>   

        <div class="row mb-3">
          <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="updateRoboticsFactory" name="updateRoboticsFactory">
              <label class="form-check-label" for="updateRoboticsFactory">
              Atualizar Fábrica de Robôs
            </label>
          </div>
        </div>   

        <div class="row mb-3">
          <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="updateLifeForm" name="updateLifeForm">
              <label class="form-check-label" for="updateLifeForm">
              Atualizar Forma de Vida
            </label>
          </div>
        </div>   
      </form>  
    </div>

    <script src="scripts/configs.js"></script>
</html>
